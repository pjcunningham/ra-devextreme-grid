# Place limit_req_zone in the nginx http context, outside server blocks.
limit_req_zone $binary_remote_addr zone=grid_demo_per_ip:10m rate=10r/s;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name demo.example.com;

    # Replace these with paths managed by your TLS tooling.
    ssl_certificate /etc/letsencrypt/live/demo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.example.com/privkey.pem;

    root /var/www/ra-devextreme-grid-demo/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # No trailing slash: /api/customers/grid reaches Uvicorn unchanged.
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 256k;
        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;

        limit_req zone=grid_demo_per_ip burst=30 nodelay;
    }

    location = /openapi.json {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        limit_req zone=grid_demo_per_ip burst=30 nodelay;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        limit_req zone=grid_demo_per_ip burst=30 nodelay;
    }
}
