name: Bug Report
description: Create a report to help us reproduce and fix a defect
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce the problem.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Grid Mode
      description: Which grid component or mode are you using?
      options:
        - Managed mode (DatagridDX)
        - Remote mode (DatagridDXRemote)
        - Both / General
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment & Versions
      description: Please specify the versions of dependencies in your project.
      value: |
        - ra-devextreme-grid version:
        - React version:
        - React-Admin version:
        - DevExtreme & devextreme-react version:
        - Browser & OS:
        - Package Manager (pnpm, npm, yarn):
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Clear steps or a minimal code example to reproduce the behavior.
      placeholder: |
        1. Set up DatagridDX with props ...
        2. Click on ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console Logs / Error Stack Traces
      description: Please copy and paste any relevant browser console output or terminal logs.
      render: shell
